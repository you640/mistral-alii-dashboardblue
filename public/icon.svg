<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Shield outline -->
  <path d="M256 80 L400 160 L400 300 Q400 420 256 460 Q112 420 112 300 L112 160 Z"
        fill="none" stroke="url(#accent)" stroke-width="16" stroke-linejoin="round"/>
  <!-- Inner shield fill -->
  <path d="M256 110 L375 178 L375 295 Q375 395 256 430 Q137 395 137 295 L137 178 Z"
        fill="url(#bg)" opacity="0.6"/>
  <!-- Magnifying glass -->
  <circle cx="240" cy="260" r="60" fill="none" stroke="url(#accent)" stroke-width="14"/>
  <line x1="285" y1="305" x2="340" y2="360" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
  <!-- AI sparkle dots -->
  <circle cx="220" cy="240" r="6" fill="#3b82f6"/>
  <circle cx="260" cy="240" r="6" fill="#06b6d4"/>
  <circle cx="240" cy="275" r="6" fill="#22d3ee"/>
  <!-- Text: A -->
  <text x="256" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#e2e8f0">A</text>
</svg>
